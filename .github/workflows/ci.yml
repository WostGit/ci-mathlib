name: PACXAI CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  pacxai-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl git python3 unzip zip jq

      - name: Restore embedded PACXAI project if bootstrap exists
        run: |
          set -euxo pipefail
          if [ -f restore_project.py ]; then
            python3 restore_project.py
          else
            echo "No restore_project.py found; assuming project files are already committed."
          fi

      - name: Install elan / Lean
        run: |
          set -euxo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install selected Lean toolchain
        run: |
          set -euxo pipefail
          if [ ! -f lean-toolchain ]; then
            echo "leanprover/lean4:v4.30.0-rc2" > lean-toolchain
          fi
          TOOLCHAIN="$(cat lean-toolchain)"
          if elan toolchain list | grep -Fxq "$TOOLCHAIN"; then
            echo "Toolchain already installed: $TOOLCHAIN"
          else
            elan toolchain install "$TOOLCHAIN"
          fi
          elan default "$TOOLCHAIN"
          lean --version | tee lean-version.log
          lake --version | tee lake-version.log

      - name: Show project files
        run: |
          set -euxo pipefail
          find . -maxdepth 4 -type f | sort | sed 's#^./##' | tee project-files.log

      - name: Build Lean project
        run: |
          set -euxo pipefail
          lake build 2>&1 | tee lean-build.log

      - name: Run Lean forbidden-token audit
        run: |
          set -euxo pipefail
          if [ -f scripts/audit.sh ]; then
            bash scripts/audit.sh 2>&1 | tee lean-audit.log
          else
            ! grep -RIn --include='*.lean' \
              -e '\bsorry\b' \
              -e '\badmit\b' \
              -e '\baxiom\b' \
              -e '\bconstant\b' \
              -e '\bunsafe\b' \
              -e '\bopaque\b' \
              -e 'TODO' \
              -e 'FIXME' \
              -- PACXAI PACXAI.lean lakefile.lean 2>&1 | tee lean-audit.log
          fi

      - name: Run distillation audit case study
        run: |
          set -euxo pipefail
          if [ -f experiments/run_distillation_audit.py ]; then
            python3 experiments/run_distillation_audit.py 2>&1 | tee case-study.log
          else
            echo "No case-study script found." | tee case-study.log
          fi

      - name: Prepare committed CI results
        if: always()
        run: |
          set -euxo pipefail
          rm -rf ci-results/latest
          mkdir -p ci-results/latest
          cp lean-version.log ci-results/latest/ 2>/dev/null || true
          cp lake-version.log ci-results/latest/ 2>/dev/null || true
          cp project-files.log ci-results/latest/ 2>/dev/null || true
          cp lean-build.log ci-results/latest/ 2>/dev/null || true
          cp lean-audit.log ci-results/latest/ 2>/dev/null || true
          cp case-study.log ci-results/latest/ 2>/dev/null || true
          if [ -d results ]; then
            mkdir -p ci-results/latest/results
            cp -R results/. ci-results/latest/results/
          fi
          cat > ci-results/latest/summary.md <<EOF
          # PACXAI CI latest results

          - Workflow: ${GITHUB_WORKFLOW}
          - Run id: ${GITHUB_RUN_ID}
          - Run attempt: ${GITHUB_RUN_ATTEMPT}
          - Commit: ${GITHUB_SHA}
          - Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          See logs in this directory.
          EOF
          find ci-results/latest -type f | sort

      - name: Commit CI results back to repo
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results/latest
          if git diff --cached --quiet; then
            echo "No CI result changes to commit."
          else
            git commit -m "ci: update latest PACXAI results [skip ci]"
            git push
          fi

      - name: Upload logs and results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pacxai-ci-logs-and-results
          path: |
            lean-version.log
            lake-version.log
            project-files.log
            lean-build.log
            lean-audit.log
            case-study.log
            results/**
            ci-results/latest/**
          if-no-files-found: ignore
          retention-days: 14
